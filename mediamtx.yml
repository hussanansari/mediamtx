server:
  listen: ":8000"  # MediaMTX listens on port 8000 for WebRTC
  protocol: "webrtc"  # Use WebRTC

rtsp:
  - url: "rtsp://admin:Hik113344@192.168.1.106:554/Streaming/Channels/102"  # Your RTSP stream URL
    stream_name: "my_stream"  # Name for your stream

# Enable WebRTC signaling
webrtc:
  listen: ":8443"  # WebRTC server runs on port 8443
  ssl:
    cert_file: "path_to_certificate.crt"  # Path to SSL certificate
    key_file: "path_to_key.key"  # Path to SSL key
  stun_servers:
    - "stun:stun.l.google.com:19302"  # Public STUN server for NAT traversal
